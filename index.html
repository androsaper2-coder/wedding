
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#eee1ce">

<title>Andro & Margaret | Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background:
    radial-gradient(ellipse at center, #f9f1e5, #d6c1a3);
  font-family: Montserrat, sans-serif;
}

.scene {
  height: 100dvh;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  perspective: 1600px;
  position: relative;
}

/* Main original artwork */

.invitation {
  width: min(100vw, 66.67dvh);
  height: min(150vw, 100dvh);
  aspect-ratio: 2 / 3;
  position: relative;
  overflow: hidden;
  background: #f7eddd;
  box-shadow: 0 20px 55px #59442c44;
}

.original {
  width: 100%;
  height: 100%;
  position: absolute;
  inset: 0;
  object-fit: cover;
  display: block;
}

/* Opening paper */

.paper {
  position: absolute;
  z-index: 5;

  left: 9%;
  right: 9%;
  top: 5%;
  height: 65%;

  transform-origin: top center;
  transform-style: preserve-3d;

  background:
    linear-gradient(
      145deg,
      #fffaf0,
      #f3e6d1 65%,
      #e6d2b1
    );

  border: 1px solid #c5a576;

  box-shadow:
    inset 0 0 0 7px #fff8eb,
    inset 0 0 0 8px #d2b88c,
    0 10px 25px #72533330;

  transition:
    transform 1.7s cubic-bezier(.2,.75,.2,1),
    opacity .8s;
}

.paper::before {
  content: "";
  position: absolute;
  inset: 15px;
  border: 1px solid #c6ac7f;
}

.paper-content {
  position: absolute;
  inset: 0;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;
  color: #765638;
}

.small-title {
  font-size: 9px;
  letter-spacing: 4px;
}

.paper-title {
  font: clamp(42px, 10vw, 65px) 'Great Vibes', cursive;
  margin: 15px 0;
}

.divider {
  width: 90px;
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    #bd9c68,
    transparent
  );
}

.paper-subtitle {
  font: italic 18px 'Cormorant Garamond', serif;
  margin-top: 15px;
}

/* Wax seal */

.seal {
  width: 76px;
  height: 76px;
  position: absolute;
  left: 50%;
  bottom: 13%;

  transform: translateX(-50%);

  display: grid;
  place-items: center;

  border-radius: 50%;
  border: 2px solid #d8b781;

  background:
    radial-gradient(
      circle at 30% 25%,
      #c27c78,
      #853d48 55%,
      #511e29
    );

  color: #f7e6c7;
  font: 30px 'Great Vibes', cursive;

  box-shadow:
    inset 0 3px 8px #f2c3a6,
    inset 0 -7px 10px #461b24,
    0 8px 18px #63432655;

  cursor: pointer;
  z-index: 8;

  transition: .7s;
}

.seal::after {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px solid #e6cda0;
  border-radius: 50%;
}

.seal span {
  position: relative;
  z-index: 1;
}

/* Opening instruction */

.instruction {
  position: absolute;
  bottom: 7%;
  width: 100%;
  text-align: center;

  font-size: 8px;
  letter-spacing: 3px;
  color: #92764e;

  animation: pulse 2s infinite;
}

@keyframes pulse {
  50% {
    opacity: .4;
  }
}

/* Open animation */

.invitation.open .paper {
  transform: rotateX(-155deg);
  opacity: 0;
  pointer-events: none;
}

.invitation.open .seal {
  opacity: 0;
  transform: translateX(-50%) scale(.2);
  pointer-events: none;
}

.invitation.open .instruction {
  opacity: 0;
}

/* Close button */

.close {
  position: absolute;
  z-index: 10;

  bottom: 18px;
  left: 50%;

  transform: translateX(-50%);

  padding: 12px 25px;

  border: 1px solid #b99a69;
  border-radius: 30px;

  background: #fff8eb;
  color: #765638;

  font-size: 8px;
  letter-spacing: 3px;

  white-space: nowrap;

  opacity: 0;
  pointer-events: none;
  transition: .5s;
  cursor: pointer;
}

.invitation.open .close {
  opacity: 1;
  pointer-events: auto;
}

/* Mobile */

@media (max-height: 650px) {
  .paper {
    height: 62%;
  }

  .seal {
    width: 62px;
    height: 62px;
    font-size: 25px;
  }

  .paper-title {
    font-size: 40px;
  }
}

@media (min-width: 700px) {
  .invitation {
    height: 94dvh;
    width: auto;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<main class="scene">

  <section class="invitation" id="invitation">

    <!-- YOUR ORIGINAL DESIGN IMAGE -->
    <img
      class="original"
      src="wedding-invitation.png"
      alt="Andro and Margaret wedding invitation"
    >

    <!-- OPENING COVER -->
    <div class="paper" id="paper">

      <div class="paper-content">

        <div class="small-title">
          A CELEBRATION OF LOVE
        </div>

        <div class="paper-title">
          Our Forever
        </div>

        <div class="divider"></div>

        <div class="paper-subtitle">
          A beautiful beginning
        </div>

      </div>

      <button class="seal" id="seal">
        <span>A &amp; M</span>
      </button>

      <div class="instruction">
        ✦ &nbsp; OPEN YOUR INVITATION &nbsp; ✦
      </div>

    </div>

    <button class="close" id="close">
      CLOSE INVITATION
    </button>

  </section>

</main>

<script>
const invitation =
  document.getElementById("invitation");

const seal =
  document.getElementById("seal");

const close =
  document.getElementById("close");

seal.addEventListener("click", () => {
  invitation.classList.add("open");
});

close.addEventListener("click", () => {
  invitation.classList.remove("open");
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    invitation.classList.remove("open");
  }
});
</script>

</body>
</html>
